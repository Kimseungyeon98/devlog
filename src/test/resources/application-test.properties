# H2 in-memory DB for tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Redis (mock으로 대체하므로 실제 연결 불필요)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT (테스트용 고정값)
jwt.secret=test-secret-key-for-testing-only-must-be-at-least-256-bits-long-enough
jwt.access-token-expiry=3600000
jwt.refresh-token-expiry=604800000

# OAuth2 (테스트용 더미값)
spring.security.oauth2.client.registration.github.client-id=test-client-id
spring.security.oauth2.client.registration.github.client-secret=test-client-secret
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost/login/oauth2/code/github
spring.security.oauth2.client.registration.github.scope=user:email,read:user
